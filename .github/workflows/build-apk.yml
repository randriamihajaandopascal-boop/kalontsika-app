name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configuration de Gradle (v8.7)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: Installation manuelle des Build-Tools 33.0.2
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"

      - name: Installation de Cordova
        run: npm install -g cordova

      - name: Telechargement des fichiers audio (175 Mo)
        run: |
          pip install gdown
          gdown https://drive.google.com/uc?id=1oD77wgmJQGb2EBu2Fca1WywGGCHO9sJO -O assets.zip
          unzip assets.zip -d build_assets

      - name: Preparation de l'environnement Cordova
        run: |
          cordova create build_tmp com.kalontsika.app Kalontsika
          cp config.xml build_tmp/
          
          # Copie des icones et fichiers PNG dans le dossier racine de build_tmp pour Cordova
          cp *.png build_tmp/ 2>/dev/null || true
          
          # Nettoyage et copie des fichiers de l'application dans www
          rm -rf build_tmp/www/*
          cp -r index.html build_tmp/www/ 2>/dev/null || true
          cp -r *.js build_tmp/www/ 2>/dev/null || true
          cp -r *.css build_tmp/www/ 2>/dev/null || true
          cp -r images build_tmp/www/ 2>/dev/null || true
          cp -r build_assets/* build_tmp/www/ 2>/dev/null || true

      - name: Ajout de la plateforme Android et Build
        env:
          CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: "https://services.gradle.org/distributions/gradle-8.7-bin.zip"
        run: |
          cd build_tmp
          cordova platform add android@12.0.0
          cordova build android --debug

      - name: Mettre a disposition l'APK genere
        uses: actions/upload-artifact@v4
        with:
          name: Kalontsika-APK
          path: build_tmp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
